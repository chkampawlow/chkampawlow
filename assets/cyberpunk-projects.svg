<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="350"
     viewBox="0 0 1200 350"
     role="img"
     aria-label="CHKAMPAWLOW Featured Projects">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#171604"/>
    </linearGradient>

    <!-- Subtle background grid -->
    <pattern id="grid"
             width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            fill="none"
            stroke="#FCEE0A"
            stroke-opacity=".04"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="350" rx="8"/>
    </clipPath>

    <!-- Card background -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191807"/>
      <stop offset="100%" stop-color="#0D0D0A"/>
    </linearGradient>

  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->
    <rect width="1200" height="350" fill="url(#bg)"/>
    <rect width="1200" height="350" fill="url(#grid)"/>

    <!-- Outer HUD frame -->
    <path d="M24 48L58 14H1142L1176 48
             V302L1142 336H58L24 302Z"
          fill="none"
          stroke="#FCEE0A"
          stroke-width="1.5">
      <animate attributeName="stroke-opacity"
               values=".55;1;.55"
               dur="5s"
               repeatCount="indefinite"/>
    </path>

    <!-- Header label -->
    <path d="M24 48L58 14H425L395 43H24Z"
          fill="#FCEE0A"/>

    <text x="65" y="35"
          font-family="monospace"
          font-size="19"
          font-weight="bold"
          fill="#080808">
      02 — FEATURED PROJECTS
    </text>

    <!-- Top-right status -->
    <text x="940" y="36"
          font-family="monospace"
          font-size="15"
          fill="#FCEE0A">
      02 PROJECTS FOUND
    </text>

    <circle cx="1125" cy="30" r="5" fill="#FCEE0A">
      <animate attributeName="opacity"
               values="1;.25;1"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <!-- ===================================== -->
    <!-- PROJECT 001 — PSYCHIC MARKETPLACE     -->
    <!-- ===================================== -->

    <path d="M65 78H575L590 93V286L575 301H65Z"
          fill="url(#card-bg)"
          stroke="#6E6412"
          stroke-width="1.5"/>

    <!-- Card accent -->
    <path d="M65 78H260"
          stroke="#FCEE0A"
          stroke-width="3"/>

    <!-- Project identifier -->
    <text x="88" y="109"
          font-family="monospace"
          font-size="14"
          fill="#C9A800">
      PROJECT_001
    </text>

    <!-- Project title -->
    <text x="88" y="148"
          font-family="monospace"
          font-size="27"
          font-weight="bold"
          fill="#FCEE0A">
      PSYCHIC
    </text>

    <text x="88" y="179"
          font-family="monospace"
          font-size="27"
          font-weight="bold"
          fill="#FCEE0A">
      MARKETPLACE
    </text>

    <!-- Description -->
    <text x="88" y="216"
          font-family="monospace"
          font-size="15"
          fill="#F5F5F5">
      Connecting clients with
    </text>

    <text x="88" y="237"
          font-family="monospace"
          font-size="15"
          fill="#F5F5F5">
      professional readers.
    </text>

    <!-- Category -->
    <text x="88" y="278"
          font-family="monospace"
          font-size="13"
          fill="#C9A800">
      [ WEB PLATFORM ]
    </text>

    <!-- Animated psychic icon -->
    <g transform="translate(500 151)">

      <circle r="43"
              fill="none"
              stroke="#6E6412"
              stroke-width="1"
              stroke-dasharray="4 7"/>

      <polygon
        points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
        fill="none"
        stroke="#FCEE0A"
        stroke-width="2">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="20s"
          repeatCount="indefinite"/>
      </polygon>

      <circle r="11"
              fill="#FCEE0A"
              fill-opacity=".12"
              stroke="#FCEE0A">

        <animate attributeName="r"
                 values="9;14;9"
                 dur="2.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle r="3" fill="#FCEE0A"/>

    </g>

    <!-- ===================================== -->
    <!-- PROJECT 002 — SYNDIC MANAGEMENT      -->
    <!-- ===================================== -->

    <path d="M610 78H1120L1135 93V286L1120 301H610Z"
          fill="url(#card-bg)"
          stroke="#6E6412"
          stroke-width="1.5"/>

    <!-- Card accent -->
    <path d="M610 78H805"
          stroke="#FCEE0A"
          stroke-width="3"/>

    <!-- Project identifier -->
    <text x="633" y="109"
          font-family="monospace"
          font-size="14"
          fill="#C9A800">
      PROJECT_002
    </text>

    <!-- Project title -->
    <text x="633" y="148"
          font-family="monospace"
          font-size="27"
          font-weight="bold"
          fill="#FCEE0A">
      SYNDIC
    </text>

    <text x="633" y="179"
          font-family="monospace"
          font-size="27"
          font-weight="bold"
          fill="#FCEE0A">
      MANAGEMENT
    </text>

    <!-- Description -->
    <text x="633" y="216"
          font-family="monospace"
          font-size="15"
          fill="#F5F5F5">
      Property and building
    </text>

    <text x="633" y="237"
          font-family="monospace"
          font-size="15"
          fill="#F5F5F5">
      management application.
    </text>

    <!-- Category -->
    <text x="633" y="278"
          font-family="monospace"
          font-size="13"
          fill="#C9A800">
      [ MANAGEMENT SYSTEM ]
    </text>

    <!-- Animated building icon -->
    <g transform="translate(1045 151)"
       fill="none"
       stroke="#FCEE0A"
       stroke-width="2">

      <!-- Building -->
      <rect x="-23" y="-32"
            width="46" height="64"/>

      <!-- Windows -->
      <path d="M-14 -22H-5V-13H-14Z
               M5 -22H14V-13H5Z
               M-14 -3H-5V6H-14Z
               M5 -3H14V6H5Z
               M-6 32V16H6V32"/>

      <!-- Rotating HUD ring -->
      <circle r="43"
              stroke="#6E6412"
              stroke-width="1"
              stroke-dasharray="4 7">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360"
          to="0"
          dur="24s"
          repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Bottom system line -->
    <path d="M65 317H1135"
          stroke="#FCEE0A"
          stroke-opacity=".3"/>

    <text x="65" y="330"
          font-family="monospace"
          font-size="10"
          fill="#C9A800">
      BUILDING REAL-WORLD DIGITAL SOLUTIONS
    </text>

    <!-- Animated scanline -->
    <rect x="25" y="-5"
          width="1150" height="2"
          fill="#FCEE0A"
          opacity=".10">

      <animate attributeName="y"
               from="-5"
               to="355"
               dur="9s"
               repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
