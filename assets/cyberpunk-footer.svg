<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="150"
     viewBox="0 0 1200 150"
     role="img"
     aria-label="CHKAMPAWLOW End of Transmission">

  <defs>

    <!-- Background -->
    <linearGradient id="footer-bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#171604"/>
    </linearGradient>

    <!-- Subtle grid -->
    <pattern id="footer-grid"
             width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            fill="none"
            stroke="#FCEE0A"
            stroke-opacity=".035"/>
    </pattern>

    <clipPath id="footer-clip">
      <rect width="1200" height="150" rx="8"/>
    </clipPath>

  </defs>

  <g clip-path="url(#footer-clip)">

    <!-- Background -->
    <rect width="1200" height="150"
          fill="url(#footer-bg)"/>

    <rect width="1200" height="150"
          fill="url(#footer-grid)"/>

    <!-- Minimal angular frame -->
    <path d="M24 35L45 14H1155L1176 35
             V115L1155 136H45L24 115Z"
          fill="none"
          stroke="#FCEE0A"
          stroke-width="1.5"
          stroke-opacity=".65"/>

    <!-- Top-left accent -->
    <path d="M45 14H260"
          stroke="#FCEE0A"
          stroke-width="3"/>

    <!-- Bottom-right accent -->
    <path d="M940 136H1155"
          stroke="#FCEE0A"
          stroke-width="3"/>

    <!-- Terminal prompt -->
    <text x="70" y="55"
          font-family="monospace"
          font-size="14"
          fill="#C9A800">
      CHKAMPAWLOW.EXE &gt; SESSION_COMPLETE
    </text>

    <!-- Main message -->
    <text x="70" y="94"
          font-family="monospace"
          font-size="31"
          font-weight="bold"
          fill="#FCEE0A">
      ALWAYS BUILDING SMTHN
    </text>

    <!-- Blinking cursor -->
    <rect x="485" y="70"
          width="13" height="28"
          fill="#FCEE0A">

      <animate attributeName="opacity"
               values="1;0;1"
               dur="1.1s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Right-side transmission label -->
    <text x="1120" y="60"
          text-anchor="end"
          font-family="monospace"
          font-size="17"
          fill="#F5F5F5">
      END OF TRANSMISSION
    </text>

    <text x="1120" y="85"
          text-anchor="end"
          font-family="monospace"
          font-size="13"
          fill="#C9A800">
      CONNECTION TERMINATED
    </text>

    <!-- Status indicator -->
    <circle cx="1107" cy="109"
            r="4"
            fill="#FCEE0A">

      <animate attributeName="opacity"
               values="1;.2;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="1095" y="113"
          text-anchor="end"
          font-family="monospace"
          font-size="12"
          fill="#C9A800">
      SYSTEM IDLE
    </text>

    <!-- Moving scanline -->
    <rect x="25" y="-3"
          width="1150" height="2"
          fill="#FCEE0A"
          opacity=".08">

      <animate attributeName="y"
               from="-3"
               to="153"
               dur="8s"
               repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
